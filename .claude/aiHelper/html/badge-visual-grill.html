<!doctype html><html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badge Visual System — FINAL: five marks, harmonised</title>
<style>
  :root{
    --bg:#fff;--fg:#171717;--surface:#fff;--raised:#fafaf9;--muted:#78716c;--border:#e7e5e4;
    --tier-chalkino:#b0713a;--tier-chalkino-soft:#f6e8dc;
    --tier-asimenio:#8a94a0;--tier-asimenio-soft:#edeff2;
    --tier-chryso:#c2951c;--tier-chryso-soft:#faf0cf;
    --tier-diamanti:#4f9fbc;--tier-diamanti-soft:#e2f2f8;
  }
  body[data-theme=dark]{
    --bg:#0c0a09;--fg:#f5f5f4;--surface:#1c1917;--raised:#292524;--muted:#a8a29e;--border:#44403c;
    --tier-chalkino:#d99a5f;--tier-chalkino-soft:#3a2a1d;
    --tier-asimenio:#b6c0cc;--tier-asimenio-soft:#2b3138;
    --tier-chryso:#e8c04e;--tier-chryso-soft:#3d3218;
    --tier-diamanti:#7fd0e3;--tier-diamanti-soft:#17323c;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
  header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
         padding:11px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
  header h1{font-size:15px;margin:0}
  button{font:inherit;padding:5px 11px;border:1px solid var(--border);border-radius:8px;
         background:var(--raised);color:var(--fg);cursor:pointer}
  button[aria-pressed=true]{border-color:var(--fg);font-weight:600}
  .muted{color:var(--muted)}
  main{padding:20px;display:flex;flex-direction:column;gap:12px;max-width:1500px}
  section{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px 18px}
  section.final{border-color:var(--fg);border-width:2px}
  section>h2{font-size:14px;margin:0 0 3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;
        padding:2px 9px;background:var(--fg);color:var(--bg)}
  .pill.open{background:transparent;color:var(--muted);border:1px solid var(--border)}
  section>p{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.55;max-width:84ch}
  ul.spec{margin:0;padding-left:18px;font-size:12.5px;line-height:1.75}
  code{font:11.5px ui-monospace,monospace;background:var(--raised);padding:1px 5px;border-radius:4px}
  .bank{display:flex;gap:12px;flex-wrap:wrap}
  .card{flex:1 1 240px;min-width:196px;border:1px solid var(--border);border-radius:11px;
        background:var(--raised);padding:12px;display:flex;flex-direction:column;gap:8px}
  .card h3{font-size:11.5px;margin:0;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .card h3 em{font-style:normal;font:10px ui-monospace,monospace;color:var(--muted)}
  .card .sizes{display:flex;align-items:center;gap:9px;justify-content:center;padding:3px 0;flex-wrap:wrap}
  .card small{font-size:10.5px;color:var(--muted);line-height:1.45}
  .badge{display:inline-flex;width:var(--sz);height:var(--sz);flex:none;color:var(--fg);
         background:var(--t);padding:max(1px,calc(var(--sz)/10));border-radius:50%}
  .badge>i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
           background:var(--t-soft);border-radius:50%}
  .badge svg{width:66%;height:66%;display:block;fill:currentColor}
  .badge.lock{background:var(--border);color:var(--muted);opacity:.55}
  .badge.lock>i{background:var(--raised)}
  .tier-chalkino{--t:var(--tier-chalkino);--t-soft:var(--tier-chalkino-soft)}
  .tier-asimenio{--t:var(--tier-asimenio);--t-soft:var(--tier-asimenio-soft)}
  .tier-chryso{--t:var(--tier-chryso);--t-soft:var(--tier-chryso-soft)}
  .tier-diamanti{--t:var(--tier-diamanti);--t-soft:var(--tier-diamanti-soft)}
  .lb{width:100%;font-size:13.5px}
  .lb-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
  .lb-row:last-child{border-bottom:none}
  .lb-rank{width:20px;color:var(--muted);font-size:12px}
  .lb-name{flex:1;display:flex;align-items:center}
  .lb-chip{margin-left:6px;padding-left:6px;border-left:1px solid var(--border);display:inline-flex;align-items:center}
  .lb-score{font-variant-numeric:tabular-nums;font-size:12.5px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:94px;
        border:1px solid var(--border);border-radius:11px;background:var(--bg);padding:10px 7px}
  .tile b{font-size:10.5px} .tile small{font-size:9.5px;color:var(--muted);line-height:1.2}
  .toast{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;
         background:var(--raised);padding:10px 13px;width:246px}
  .toast b{font-size:12.5px} .toast small{display:block;font-size:10.5px;color:var(--muted)}
  .sizetag{font-size:10px;color:var(--muted);width:24px;display:inline-block}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  table.tok{border-collapse:collapse;font-size:11.5px;width:100%}
  table.tok th,table.tok td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--border)}
  table.tok th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .sw{display:inline-block;width:15px;height:15px;border-radius:4px;border:1px solid var(--border);vertical-align:-3px}
  pre.pathdump{font:10px ui-monospace,monospace;background:var(--bg);border:1px solid var(--border);
       border-radius:8px;padding:9px;overflow-x:auto;margin:0;color:var(--muted);white-space:pre-wrap;word-break:break-all}
</style></head>
<body data-theme="light">
<header>
  <h1>Badge Visual System — final</h1>
  <span class="muted">five marks, harmonised · nothing open</span>
  <button id="theme" aria-pressed="false">dark theme</button>
</header>
<main id="main"></main>
<script>
const f=n=>(+n).toFixed(2);
/* an ellipse as two 180° arcs — a rotated petal is still plain path data */
const ell=(cx,cy,rx,ry,rot=0)=>{const r=rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  return `M${f(cx-rx*c)} ${f(cy-rx*s)}A${rx} ${ry} ${f(rot)} 0 1 ${f(cx+rx*c)} ${f(cy+rx*s)}A${rx} ${ry} ${f(rot)} 0 1 ${f(cx-rx*c)} ${f(cy-rx*s)}Z`};
/* six ellipse petals, rx radial — FlowerGrid's own construction (46/37/90) */
const petals=(n,dist,rx,ry)=>[...Array(n)].map((_,i)=>{const a=-90+360/n*i,r=a*Math.PI/180;
  return ell(12+dist*Math.cos(r),12+dist*Math.sin(r),rx,ry,a)}).join("");

/* ══ THE FIVE · harmonised: ~20×19 optical box centred on (12,12) ══════ */
const FINAL={
 korifi:  {name:"Στην Κορυφή",  cap:"κορυφή",   d:"M14 3.2 22 20.4H6zM6.8 9.8 12.6 20.4H2z"},
 makry:   {name:"Μακρυλέξης",   cap:"γραμμές",  d:"M9.6 3h1.6L4.6 21H1.4zM12.8 3h1.6L22.6 21h-3.2zM8.2 9h7.6v1.9H8.2zM5.8 15.6h12.4v2.1H5.8z"},
 tzimani: {name:"Τζιμάνι",      cap:"πέταλα",   d:petals(6,6.9,3.8,3.2)},
 pangram: {name:"Κυνηγός Πανγκράμ",cap:"κεραυνός",d:"M14.2 2.2 3.6 13.9h5.9l-1 7.9L20.4 10.1h-6.1z"},
 pontoi:  {name:"Συλλέκτης Πόντων",cap:"λίθος", d:"M7.6 2.6h8.8l4.8 6.4L12 21.4 2.8 9z"},
};
/* the pre-refinement γραμμές, kept only for the before/after in section 2 */
const OLD_TRACKS="M7.4 2.6h3L5.2 21.4H1zM13.6 2.6h3l5.2 18.8h-4.2zM8 5.6h8v1.9H8zM7 10.4h10v2H7zM5.8 15.6h12.4v2.1H5.8z";

const M=Object.fromEntries(Object.entries(FINAL).map(([k,v])=>[k,v.d]));
M.oldtracks=OLD_TRACKS;
const KEYS=["korifi","makry","tzimani","pangram","pontoi"];
const TIERS=[["chalkino","Χάλκινο"],["asimenio","Ασημένιο"],["chryso","Χρυσό"],["diamanti","Διαμάντι"]];

const b=(m,tier,sz,cls="")=>`<span class="badge ${cls} tier-${tier}" style="--sz:${sz}px"><i><svg viewBox="0 0 24 24"><path d="${M[m]}"/></svg></i></span>`;
const lbRow=(r,name,m,tier,score)=>`<div class="lb-row"><span class="lb-rank">${r}</span><span class="lb-name">${name}<span class="lb-chip">${b(m,tier,14)}</span></span><span class="lb-score">${score}</span></div>`;

let H="";

/* ══ 1 · the five ══ */
H+=`<section class="final"><h2>1. The five marks <span class="pill">final</span></h2>
<p>Refinement pass applied: all five now sit in the same optical box (about 20×19 units centred on 12,12) with
comparable ink mass, so no badge looks bigger or heavier than its neighbours inside an identical ring. Each is
shown at tile, toast and chip size, then in the locked treatment.</p>
<div class="bank">${KEYS.map(k=>`<div class="card"><h3>${FINAL[k].name} <em>${FINAL[k].cap}</em></h3>
 <div class="sizes">${b(k,"chryso",34)}${b(k,"asimenio",18)}${b(k,"chalkino",12)}${b(k,"chalkino",30,"lock")}</div>
 <div class="sizes" style="gap:6px">${TIERS.map(([t])=>b(k,t,22)).join("")}</div>
 <small>34 · 18 · 12 · locked, then all four tiers at 22.</small></div>`).join("")}</div></section>`;

/* ══ 2 · what changed in the pass ══ */
H+=`<section><h2>2. What the refinement changed <span class="pill open">review this</span></h2>
<p>One change was substantive rather than cosmetic, and you can reject it.</p>
<div class="bank">
 <div class="card" style="flex:1 1 260px"><h3>Γραμμές — before <em>3 sleepers</em></h3>
  <div class="sizes">${b("oldtracks","chryso",34)}${b("oldtracks","asimenio",18)}${b("oldtracks","chalkino",12)}</div>
  <small>Near-parallel rails with three evenly spaced crossbars. This is the version that reads as a ladder at chip size.</small></div>
 <div class="card" style="flex:1 1 260px"><h3>Γραμμές — after <em>2 sleepers</em></h3>
  <div class="sizes">${b("makry","chryso",34)}${b("makry","asimenio",18)}${b("makry","chalkino",12)}</div>
  <small><b>Two</b> crossbars instead of three, and a much wider taper: the rails now converge from 21 units apart at the base to 3 at the top. Perspective is what separates a track from a ladder, so the taper does the work the crossbars were failing to do.</small></div>
 <div class="card" style="flex:1 1 300px"><h3>The other four</h3>
  <div class="sizes">${["korifi","tzimani","pangram","pontoi"].map(k=>b(k,"chryso",30)).join("")}</div>
  <small>Cosmetic only. <b>Κορυφή</b> narrowed and re-centred; <b>κεραυνός</b> widened and its waist thickened, because it was the lightest mark in the set; <b>λίθος</b> trimmed slightly, because it was the heaviest; <b>πέταλα</b> thickened from 3.1 to 3.2 semi-minor so the ring of six survives 12px.</small></div>
</div></section>`;

/* ══ 3 · surfaces ══ */
H+=`<section><h2>3. The three real surfaces <span class="pill">final</span></h2>
<p>Everything the badges actually appear on. Flip the theme in the header and check all three again.</p>
<div class="bank">
 <div class="card" style="flex:1 1 300px"><h3>Leaderboard chip <em>14px</em></h3><div class="lb">
  ${lbRow(1,"Δημήτρης","korifi","chryso","1.284")}${lbRow(2,"Μαρία 🌸","tzimani","asimenio","1.150")}
  ${lbRow(3,"Ανώνυμος","makry","diamanti","998")}${lbRow(4,"Νίκος","pangram","chalkino","870")}
  ${lbRow(5,"Ελένη","pontoi","chryso","845")}</div>
  <small>Row 2 keeps an emoji in the display name deliberately — that collision is the reason this work exists, and it is now gone.</small></div>
 <div class="card" style="flex:1 1 380px"><h3>Trophy Case</h3><div class="row" style="justify-content:center">
  <div class="tile">${b("korifi","chryso",32)}<b>Στην Κορυφή</b><small>Χρυσό · 25</small></div>
  <div class="tile">${b("makry","diamanti",32)}<b>Μακρυλέξης</b><small>Σεντόνι · 13</small></div>
  <div class="tile">${b("tzimani","chalkino",32)}<b>Τζιμάνι</b><small>Χάλκινο · 1</small></div>
  <div class="tile">${b("pangram","chalkino",32,"lock")}<b>Πανγκράμ</b><small>Κλειδωμένο</small></div>
  <div class="tile">${b("pontoi","chalkino",32,"lock")}<b>Πόντοι</b><small>Κλειδωμένο</small></div></div>
  <small>Locked tiles use the neutral frame — no filter, no borrowed tier colour, and the mark stays visible so you can see what you are chasing.</small></div>
 <div class="card" style="flex:1 1 260px"><h3>Unlock toast</h3>
  <div class="toast">${b("pangram","asimenio",34)}<span><b>Κυνηγός Πανγκράμ</b><small>Ασημένιο ξεκλειδώθηκε!</small></span></div>
  <small>The toast currently shows a fixed 🏆 rather than the badge — swapping it for the earned mark is in the ticket's scope.</small></div>
</div></section>`;

/* ══ 4 · separation ══ */
H+=`<section><h2>4. Separation check <span class="pill">final</span></h2>
<p>The five together at every size they render at. This is the test that matters: they have to be separable as a set.</p>
<div class="bank"><div class="card" style="flex:1 1 100%">
 <h3>Κορυφή · Μακρυλέξης · Τζιμάνι · Πανγκράμ · Πόντοι</h3><div style="padding:3px 0">
 ${[12,14,18,24,34].map(s=>`<div class="row"><span class="sizetag">${s}</span>${KEYS.map((k,i)=>b(k,TIERS[i%4][0],s)).join("")}
   <span style="width:16px"></span>${KEYS.map(k=>b(k,"chryso",s)).join("")}</div>`).join("")}
 <div class="row muted" style="font-size:9.5px;margin-top:4px">${KEYS.map(k=>`<span style="width:34px;display:inline-block;text-align:center">${FINAL[k].cap}</span>`).join("")}</div>
 </div><small>Left group is mixed tiers, right group is all-gold — the harder case, because only the drawing separates them.</small></div></div></section>`;

/* ══ 5 · tokens + path data ══ */
H+=`<section><h2>5. What ships <span class="pill">final</span></h2>
<p>The eight token values and the five path strings, exactly as the ticket will carry them.</p>
<div class="bank">
 <div class="card" style="flex:1 1 420px"><h3>Tokens for <code>globals.css</code></h3>
 <table class="tok"><tr><th>name</th><th>role</th><th>value</th></tr>
 ${TIERS.map(([t,label])=>`<tr><td><code>--tier-${t}</code></td><td>ring · ${label}</td><td><span class="sw" style="background:var(--tier-${t})"></span></td></tr>
 <tr><td><code>--tier-${t}-soft</code></td><td>disc</td><td><span class="sw" style="background:var(--tier-${t}-soft)"></span></td></tr>`).join("")}
 </table><small>Each declared twice — light <code>:root</code> and the dark block — plus eight <code>@theme inline</code> lines so Tailwind exposes <code>bg-tier-chryso-soft</code> and friends. Swatches are live; flip the theme.</small></div>
 <div class="card" style="flex:1 1 520px"><h3>The five paths <em>viewBox 0 0 24 24</em></h3>
 <pre class="pathdump">${KEYS.map(k=>`${k.padEnd(8)} ${M[k]}`).join("\n\n")}</pre>
 <small>Every mark is a single flattened path — the petals are twelve arcs, not six <code>&lt;ellipse&gt;</code> elements — so <code>mark: { path, viewBox }</code> holds for all five with no raw SVG markup in the catalogue.</small></div>
</div></section>`;

document.getElementById("main").innerHTML=H;
document.getElementById("theme").onclick=e=>{
 const d=document.body.dataset.theme==="dark";
 document.body.dataset.theme=d?"light":"dark";
 e.target.setAttribute("aria-pressed",String(!d));
 e.target.textContent=d?"dark theme":"light theme";
};
</script>
</body></html>
